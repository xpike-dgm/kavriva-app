# CI — architecture checks (installed in Step-7 closure of Gate-8 audit findings).
# Spec: .github/workflows/CI_PLAN.md. Events/fail/merge per CI plan; T3 human gates
# stay outside automation (reviewer verifies, gate enforces).
name: architecture-checks
on:
  push:
    branches-ignore: []
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kavriva-app
        uses: actions/checkout@v4
      # No planning-repo checkout: motobakim-plan is private and this workflow must run
      # on the default token. Planning-truth refs resolve via the KNOWN_PLANNING closed
      # set (verified by strict --plan-root runs before every push — process rule).
      - name: Run architecture suite (CI mode)
        run: python3 modules/e10-graph/checks/run_all.py
      - name: Rebuild generated index (proof that generation is reproducible)
        run: |
          python3 modules/e10-graph/checks/build_index.py
          python3 modules/e10-graph/checks/routing_run.py
          git diff --exit-code -- vault/INDEX/ || (echo "INDEX not reproducible" && exit 1)
