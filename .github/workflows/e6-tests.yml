name: e6-release-policy-tests
on:
  push:
  pull_request:
jobs:
  e6-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Kavriva
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # existing reviewed v5 pin
        with:
          persist-credentials: false
      - name: Test logical registry and publication separation
        run: python3 -m unittest discover -s modules/e06-release/tests -v
