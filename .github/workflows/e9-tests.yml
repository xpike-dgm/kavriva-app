name: e9-bounded-proposal-tests
on:
  push:
  pull_request:
jobs:
  e9-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Kavriva
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # existing reviewed v5 pin
        with:
          persist-credentials: false
      - name: Test E9 internal proposals
        run: python3 -m unittest discover -s modules/e09-ai/tests -v
