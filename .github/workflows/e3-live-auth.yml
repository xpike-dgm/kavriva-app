name: e3-live-auth-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  live-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Kavriva
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
      - name: Install pinned PostgreSQL test dependencies
        run: python3 -m pip install -r modules/e03-server/tests/requirements.txt
      - name: Start isolated local Supabase Auth and apply migrations
        run: |
          if ! npx --yes supabase@2.117.0 start \
            -x realtime,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "Local Supabase startup or migration failed; no credentials printed."
            exit 1
          fi
          npx --yes supabase@2.117.0 status -o json > "$RUNNER_TEMP/supabase-status.json"
      - name: Verify real Auth signup, current session, guarded effect and logout
        run: python3 modules/e03-server/tests/verify_local_supabase_auth.py "$RUNNER_TEMP/supabase-status.json"
      - name: Reject direct database and private Storage bypasses
        run: python3 modules/e03-server/tests/verify_local_defense_paths.py "$RUNNER_TEMP/supabase-status.json"
